[build-system]
requires = ["setuptools>=61", "setuptools-scm>=8.0"]

[project]
name = "PyEarthTools-archive-AWS"
description = "PyEarthTools archive for Met Office and partner datasets available via the AWS Sustainable Data Initiative (ASDI)"
requires-python = ">=3.10, <3.14"
license = {file = "LICENSE"}
keywords = ["pyearthtools", "aws", "met-office", "nwp", "weather"]
maintainers = [
  {email = "stephen.haddad@metoffice.gov.uk", name = "Stephen Haddad"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
  "pyearthtools-data>=0.1.0",
  # AWS / cloud access
  "s3fs>=2024.1.0",
  "fsspec>=2024.1.0",
  # Data reading
  "xarray>=2024.1.0",
  "zarr>=2.16.0",
  "cfgrib>=0.9.10",
  "eccodes>=1.6.0",
  # General scientific stack
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "scipy>=1.11.0",
  # Visualisation (optional but expected in notebooks)
  "matplotlib>=3.7.0",
  "cartopy>=0.22.0",
]
dynamic = ["version", "readme"]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov",
  "black",
  "isort",
  "mypy",
]
sagemaker = [
  "sagemaker>=2.200.0",
  "boto3>=1.34.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type = "text/markdown"}

[project.urls]
homepage = "https://pyearthtools.readthedocs.io/en/latest/"
documentation = "https://pyearthtools.readthedocs.io/en/latest/"
repository = "https://github.com/MetOffice/PyEarthTools"

[tool.isort]
profile = "black"

[tool.black]
line-length = 120

[tool.mypy]
warn_return_any = true
warn_unused_configs = true

